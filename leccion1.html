<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
h{
    color:blueviolet
}
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #d1d5db; /* Fondo gris claro general */
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
}


/* Tarjeta contenedora blanca principal con bordes redondeados */
.contenedor {
    background-color: #ffffff;
    border-radius: 20px;
    padding: 40px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    max-width: 800px;
    width: 90%;
    text-align: left;
}


/* Texto pequeño superior "PALABRA NUEVA" */
.contenedor h3 {
    color: #780ac2;
    font-size: 14px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 8px;
    font-weight: 700;
}


/* Título principal "¿Cuál de estos es el gato?" */
.contenedor h1 {
    color: #3c3c3c;
    font-size: 26px;
    margin-top: 0;
    margin-bottom: 30px;
    font-weight: 700;
}


/* Disposición de las 3 opciones en fila usando Flexbox */




/* Para alinear las tres tarjetas de opción horizontalmente */
div.contenedor {
    display: block; /* Mantiene la estructura del bloque principal */
}


/* Agrupador flexible para las tarjetas de opciones */
.contenedor > div.opcion {
    display: inline-block;
    vertical-align: top;
    width: 28%;
    margin: 1%;
    background-color: #ffffff;
    border: 2px solid #e5e5e5;
    border-radius: 16px;
    padding: 20px 10px;
    text-align: center;
    box-sizing: border-box;
    cursor: pointer;
    transition: all 0.2s ease;
}


/* Efecto al pasar el cursor sobre las tarjetas */
.contenedor > div.opcion:hover {
    border-color: #84d800; /* Borde verde estilo Duolingo */
    background-color: #ddf4ff; /* Fondo azul tenue */
    transform: translateY(-3px);
}


/* Estilo para las imágenes dentro de cada opción */
.contenedor > div.opcion img {
    max-width: 100%;
    height: 110px;
    object-fit: contain;
    margin-bottom: 12px;
}


/* Estilo para el texto de la opción (p. ej. Mixtu, Badu, Juiji) */
.contenedor > div.opcion p {
    margin: 0;
    color: #4b4b4b;
    font-size: 18px;
    font-weight: bold;
}
</style>
</head>
<body>
    <div class="contenedor">
        <h3>Palabra Nueva</h3>
        <h1>¿Cúal de estos es un gato?</h1>

        <div class="opcion">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSespphHGqXk7INboM-urpghL2Yn4nU4Fjm0yemeQU6Uw&s=10" alt="Mixtu">
            <p>Mixtu</p>
        </div>
        <div class="opcion">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQCFxg17gq69C4sy25ONkiWvRx5St7LhuwQ33EKROknzA&s=10" alt="Badu">
            <p>Badu</p>
        </div>
        <div class="opcion">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSd3XtZRzClZBcymqnVcDrQZH5cVHgtpYpa12hAVhW2AQ&s=10" alt="juiji">
            <p>juiji</p>
        </div>
    </div>
</body>
</html>
